name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  endorsement-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: endorsement-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: endorsement-api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  routes-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routes-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: routes-api/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -cover ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  docker:
    needs: [endorsement-api, routes-api, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [endorsement-api, routes-api, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ${{ matrix.service }}:ci ${{ matrix.service }}
